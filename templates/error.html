{% extends "base.html" %}

{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 60px auto; text-align: center;">
  <div class="card" style="padding: 36px 24px;">
    <div style="font-size: 48px; font-weight: 700; color: var(--text-muted); font-family: var(--font-mono); margin-bottom: 8px;">
      {{ code }}
    </div>
    <h1 style="font-size: 20px; font-weight: 600; margin-bottom: 12px; color: var(--text-main);">
      {{ message }}
    </h1>
    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">
      If you were trying to access restricted media from a child account, this item is hidden and unavailable.
    </p>
    <a href="{{ url_for('home') }}" class="btn btn-primary">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
